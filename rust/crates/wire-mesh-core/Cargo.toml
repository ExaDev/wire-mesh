[package]
name = "wire-mesh-core"
description = "Domain logic, ports, and adapters for the wire-mesh protocol: the direct mirror of the TypeScript core minus its generated wire layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
# "net" gates tcp_transport.rs's own tokio::net/mio dependency behind an opt-out feature, default-on so every existing native consumer is unaffected. A consumer that never needs TCP transport -- most concretely, wire-mesh-threshold-wasm, whose entire wasm32-unknown-unknown build target has no mio support at all -- depends on this crate with `default-features = false` to skip it, rather than pulling in a networking stack a WASM crypto binding has no use for.
default = ["net"]
net = ["tokio/net", "tokio/io-util", "tokio/rt-multi-thread", "tokio/time"]
# Exposes `domain::secure_channel::begin_handshake_with`, which starts a handshake from a caller-chosen ephemeral key and nonce so conformance vectors can reproduce a handshake byte for byte. A fixed ephemeral key is a key-reuse hazard, so only the conformance binary enables this; the crate's own tests have it through `cfg(test)`.
conformance = []

[dependencies]
wire-mesh-wire = { path = "../wire-mesh-wire" }
async-trait = { workspace = true }
futures-core = { workspace = true }
# Not `{ workspace = true }`: the workspace-level tokio dependency pins a fixed feature set unconditionally (feature unification would otherwise always pull "net" in regardless of this crate's own Cargo feature), so "net"'s tokio features are added explicitly above instead.
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt"] }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
p256 = { workspace = true }
hkdf = { workspace = true }
aes-gcm = { workspace = true }
# Only to switch on its `zeroize` feature, for the round keys of every AES-GCM key this crate uses.
aes = { workspace = true }
rand = { workspace = true }
minicbor = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm32-unknown-unknown has no operating system entropy source, so each getrandom this crate reaches needs its browser backend enabled by a crate in the graph, and enabling them here lets any wasm32 consumer of this crate build without repeating it. rand 0.8 draws from getrandom 0.2 ("js"). p256's ECDSA signing reaches getrandom 0.4 through crypto-bigint (rfc6979), which will not build on this target without "wasm_js"; nothing in the workspace draws randomness from that copy.
getrandom-0-2 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }
getrandom-0-4 = { package = "getrandom", version = "0.4", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
tokio-stream = { version = "0.1", default-features = false }

[lints]
workspace = true
