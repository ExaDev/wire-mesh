[workspace]
resolver = "2"
members = [
    "crates/wire-mesh-wire",
    "crates/wire-mesh-core",
    "crates/wire-mesh-conformance",
    "crates/wire-mesh-threshold",
    "crates/wire-mesh-threshold-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
# None of the crates is on crates.io. cargo-deny treats a path dependency with no version in a publishable crate as a wildcard, so this is what lets `wildcards = "deny"` hold for third-party dependencies only; publishing a crate removes it for that crate.
publish = false
repository = "https://github.com/ExaDev/wire-mesh"

[workspace.dependencies]
# Pinned exactly, not a caret range: the 2.x line changed the Encode/Decode trait shapes and CborLen surface relative to the widely documented 0.2x series, and the hand-written impls here are written against 2.2.2's shapes.
minicbor = { version = "=2.2.2", default-features = false, features = ["alloc"] }
async-trait = { version = "0.1", default-features = false }
futures-core = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", default-features = false, features = [
    "net",
    "io-util",
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
# "zeroize" wipes the state of a dropped hash core, which is what holds the keyed state of the HMAC inside HKDF (hmac has no wiping of its own, and its own "zeroize" feature only forwards to the digest crate this enables).
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize", "rand_core"] }
# Zeroes the exported secret of a node identity when it is dropped.
# "serialization" gives the key and package types their serialize and deserialize methods, and "cheater-detection" makes aggregation name the participant that sent a bad share. frost-core is pinned to the version frost-ed25519 depends on.
frost-ed25519 = { version = "2", default-features = false, features = ["std", "serialization", "cheater-detection"] }
frost-core = { version = "2.2.0", default-features = false, features = ["std", "serialization", "cheater-detection"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
p256 = { version = "0.14", default-features = false, features = ["std", "ecdsa", "ecdh"] }
hkdf = { version = "0.13", default-features = false }
# "zeroize" makes aes-gcm wipe its GHASH key. It does not reach the block cipher: aes-gcm 0.10 does not forward it to `aes`, so the `aes` entry below turns it on there, which wipes the expanded round keys when a cipher is dropped.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
# "std" and "std_rng" are what `OsRng` and `thread_rng` need.
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
