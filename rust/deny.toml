# Enforced in CI by the cargo-deny job. A crate that is not in the bans allowlist fails the check, so a new direct or transitive dependency is added here in the same change, with the reason it is wanted. The advisories section is checked by a separate, scheduled job outside the required checks, so a newly published advisory never changes the verdict of an unrelated pull request.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is flagged as unmaintained, not as vulnerable. frost-core reaches it through postcard and heapless 0.7 for a polyfill of atomics on targets that lack them, and none of this workspace's own code calls it. Remove this entry when frost-core stops depending on postcard 1 with heapless 0.7." },
]

[licenses]
version = 2
# The workspace is MIT licensed, so only permissive licences are accepted for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
# A second version of any crate fails unless it is skipped below with the reason. Skips name the older version, so a third version or a newer duplicate still fails.
multiple-versions = "deny"
# The workspace crates depend on each other by path with no version; every other dependency must state one.
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "base16ct@0.2.0", reason = "the frost and ed25519 line still uses the older RustCrypto release that p256 0.14 has left behind" },
    { crate = "block-buffer@0.10.4", reason = "older digest generation, kept by ed25519-dalek, frost-ed25519 and aes-gcm" },
    { crate = "cpufeatures@0.2.17", reason = "older release kept by aes, polyval and curve25519-dalek" },
    { crate = "crypto-common@0.1.6", reason = "older digest generation, kept by ed25519-dalek, frost-ed25519 and aes-gcm" },
    { crate = "digest@0.10.7", reason = "older generation kept by ed25519-dalek, frost-ed25519 and aes-gcm; sha2, hkdf and p256 use 0.11" },
    { crate = "getrandom@0.2.17", reason = "rand 0.8 and the ed25519 and frost line stay on getrandom 0.2; p256 0.14 reaches getrandom 0.4" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8, ed25519-dalek and frost stay on rand_core 0.6; p256 0.14 uses 0.10" },
    { crate = "sha2@0.10.9", reason = "ed25519-dalek and frost-ed25519 stay on the older digest generation" },
    { crate = "signature@2.2.0", reason = "ed25519 stays on signature 2 while p256 0.14 uses signature 3" },
    { crate = "syn@2.0.119", reason = "proc-macro crates move to syn 3 at different times" },
]
