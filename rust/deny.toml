# Enforced in CI by the cargo-deny job. A crate that is not in the bans allowlist fails the check, so a new direct or transitive dependency is added here in the same change, with the reason it is wanted.

[advisories]
version = 2
yanked = "deny"
# Each ignore names the dependency path that cannot be upgraded and is removed when it can be.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 is pinned by elliptic-curve 0.13, which p256 0.13 uses; the fix is in crypto-bigint 0.7, which needs the next p256 major version" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is pulled in by frost-core through postcard and heapless 0.7; remove this when frost-core drops that path" },
]

[licenses]
version = 2
# The workspace is MIT licensed, so only permissive licences are accepted for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
# The workspace crates depend on each other by path with no version, which cargo-deny counts as a wildcard while the crates are unpublished. Third-party dependencies are all pinned by Cargo.lock and listed below.
wildcards = "allow"
# Every crate in the dependency graph, including those only built for wasm32 or only for tests. Direct dependencies state why they are used; the rest are listed under the dependency that pulls them in.
