<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wire-mesh console</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 1rem;
      }
      header {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      input[type="url"] {
        flex: 1;
        min-width: 16rem;
      }
      section {
        margin-top: 1rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 0.25rem 0.5rem;
        border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        overflow-wrap: anywhere;
      }
      .status {
        font-weight: 600;
      }
      .mono {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
      .frame-log {
        max-height: 24rem;
        overflow-y: auto;
      }
      .connection {
        margin-top: 1.5rem;
        padding: 1rem;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        border-radius: 0.5rem;
      }
      .connection-header {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .connection-address {
        flex: 1;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>wire-mesh console</h1>
    <form id="connect-form">
      <header>
        <label for="node-address">Node</label>
        <input
          id="node-address"
          type="url"
          value="ws://localhost:8787"
          required
        />
        <button type="submit" id="connect-button">Connect</button>
      </header>
      <p class="mono">
        Domains offered:
        <label><input type="checkbox" name="domain" value="core/management" checked /> core/management</label>
        <label><input type="checkbox" name="domain" value="core/exec" /> core/exec</label>
        <label><input type="checkbox" name="domain" value="core/data" checked /> core/data</label>
      </p>
    </form>
    <div id="connections"></div>
    <template id="connection-template">
      <section class="connection">
        <header class="connection-header">
          <span class="connection-address mono"></span>
          <button type="button" class="ping-button" disabled>Send ping</button>
          <button type="button" class="close-button">Disconnect</button>
        </header>
        <p class="status connection-status">idle</p>
        <section>
          <h2>Peer directory</h2>
          <p class="directory-empty">No gossip received yet.</p>
          <table class="directory-table" hidden>
            <thead>
              <tr><th>device</th><th>addresses</th><th>snapshot (unix s)</th></tr>
            </thead>
            <tbody class="directory-body"></tbody>
          </table>
        </section>
        <section>
          <h2>Frame log</h2>
          <table class="frame-log-table">
            <thead>
              <tr><th>direction</th><th>frame</th></tr>
            </thead>
            <tbody class="frame-log"></tbody>
          </table>
        </section>
      </section>
    </template>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
