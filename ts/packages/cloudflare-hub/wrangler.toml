# A reference deployment of a wire-mesh hub node on Cloudflare Workers -- see README.md for what is implemented versus deferred. `wrangler deploy --dry-run --outdir=dist` (the package's _build task) validates the bundle without any Cloudflare credentials, which is what CI runs; a real deploy needs `wrangler deploy` with an authenticated account and is deliberately not part of this package's CI. The hub state lives in one named Durable Object instance -- see src/worker.ts for why a plain Worker cannot host it.
name = "wire-mesh-hub"
account_id = "71ead1d40a4edda71baa7722524ba3b4"  # the ExaDev account, explicit so a non-interactive deploy never lands in the wrong one
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# mesh.exadev.io: a Workers custom domain -- Cloudflare attaches and manages the
# DNS record itself via the Workers API, so deploying needs no separate DNS-record
# permission. The ExaDev team's agents (agent-comms, via wss://) use this hub as
# their cross-machine meeting point (ExaDev/wire-mesh#154, ExaDev/agent-comms#149).
routes = [
  { pattern = "mesh.exadev.io", custom_domain = true },
]

[durable_objects]
bindings = [{ name = "HUB", class_name = "RelayHubDurableObject" }]

# web-console's built output, served from this same origin (ExaDev/wire-mesh#183): opening mesh.exadev.io in a browser gets the actual console rather than only the bare health check. run_worker_first is scoped to exactly the two paths the Worker itself needs to decide on: "/" (a WebSocket upgrade there must reach the Durable Object, not the static index.html a plain GET to the same path would otherwise get) and "/health" (so it always reaches the Worker rather than depending on whether the request happens to carry a browser's Sec-Fetch-Mode: navigate header, which is the default heuristic every other path is left to use). Every other path (built JS/CSS, the manifest, the service worker, the icons) bypasses the Worker entirely and is billed only as a static asset request.
[assets]
directory = "../web-console/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/health"]

# Hibernation-capable (SQLite-backed) class, per current wrangler guidance for DOs that hold WebSockets.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayHubDurableObject"]

[dev]
port = 8787
