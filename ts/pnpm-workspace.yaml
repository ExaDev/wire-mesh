packages:
  - "packages/*"
overrides:
  conventional-changelog-writer: "^9.2.0"
# Left disallowed, matching this workspace's existing behaviour under pnpm 10 (which only ever warned "Ignored build scripts" for these three and installed successfully without running them).
allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
minimumReleaseAgeExclude:
  - '@exadev/eslint-config'

# cddl.js is a git dependency (not published to npm) with a "prepare" build script -- an ExaDev-owned package this workspace already trusts, not a third-party one, so allowing its build script is the documented exception to pnpm's default script-blocking.
onlyBuiltDependencies:
  - cddl.js
saveExact: true
