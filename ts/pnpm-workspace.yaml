packages:
  - "packages/*"

# pnpm 11 and later default this to false, which resolves a sibling dependency from the npm registry even when the workspace already holds a version satisfying the declared range. Every inter-package edge here is a plain exact pin rather than the workspace protocol, because @exadev/semantic-release-workspace rewrites those pins as siblings release and plain `npm publish` then ships a real semver range; without this setting those same pins would make pnpm download a published wire-mesh-core instead of linking packages/core, so the workspace would stop being a workspace.
linkWorkspacePackages: true

overrides:
  # release-workspace.config.ts's generateNotes step uses the conventionalcommits preset, whose templates call a helper only conventional-changelog-writer@9 or newer provides. @semantic-release/release-notes-generator depends on conventional-changelog-writer@^8, so without this the preset loads and then throws from inside handlebars at render time. Scoped to release-notes-generator rather than global because it is the only consumer that renders with the writer at all: @semantic-release/commit-analyzer declares the same dependency but never imports it, using only the preset's whatBump.
  "@semantic-release/release-notes-generator>conventional-changelog-writer": 9.2.1
# Which dependencies may run an install script, and which may not. pnpm blocks every install script by default, so each entry is a decision recorded rather than merely a permission granted, and `false` says as much as `true`.
#
# mediasoup's postinstall either downloads a prebuilt mediasoup-worker binary for the current platform or, where none is published for it, builds one locally through its own bundled Meson and Ninja invocation, needing a C++ toolchain this workspace's Rust build already requires. It is genuinely necessary rather than a convenience: the worker is a separate native process mediasoup's Node bindings spawn and speak to over a pipe, so refusing the script leaves wire-mesh-sfu installed and unable to start one.
#
# The other three are refused because nothing here consumes what their scripts produce, and installs complete without them. esbuild and sharp both resolve their platform binaries through optional dependencies rather than the script, and no package in this workspace runs a test suite against the workerd runtime.
allowBuilds:
  esbuild: false
  mediasoup: true
  sharp: false
  workerd: false
minimumReleaseAgeExclude:
  - '@exadev/eslint-config'
  - '@exadev/semantic-release-workspace'
  - trilean-regex
  - trilean
  - web-ui-primitives
saveExact: true
