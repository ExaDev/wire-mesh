packages:
  - "packages/*"
overrides:
  # trilean@1.6.1's own published package.json still declares its sibling workspace dependency as "trilean-regex: workspace:^", never rewritten to a real semver range before publish (a real bug in trilean's own release pipeline, filed upstream -- see ExaDev/trilean's issue tracker) -- pnpm refuses to resolve an unrewritten workspace protocol range outside the monorepo that declared it, so every external consumer of trilean is currently unable to install it at all without this override forcing resolution to trilean-regex's own real, independently published version.
  trilean-regex: "^1.0.2"
# Left disallowed, matching this workspace's existing behaviour under pnpm 10 (which only ever warned "Ignored build scripts" for these three and installed successfully without running them).
allowBuilds:
  esbuild: false
  mediasoup: true
  sharp: false
  workerd: false
minimumReleaseAgeExclude:
  - '@exadev/eslint-config'
  - trilean-regex@1.0.2
  - trilean
  - web-ui-primitives

# cddl.js is a git dependency (not published to npm) with a "prepare" build script -- an ExaDev-owned package this workspace already trusts, not a third-party one, so allowing its build script is the documented exception to pnpm's default script-blocking. mediasoup's own postinstall either downloads a prebuilt mediasoup-worker binary for the current platform or, when none is published for it, builds one locally via its own bundled Meson/Ninja invocation (needs a C++ toolchain, already required by this workspace's own Rust build). Genuinely necessary: the worker is a real, separate native process mediasoup's Node bindings spawn and speak to over a pipe, not something requiring script access, unlike a supply-chain-risk postinstall this policy otherwise exists to block.
onlyBuiltDependencies:
  - cddl.js
  - mediasoup
saveExact: true
