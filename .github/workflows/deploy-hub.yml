# Deploys cloudflare-hub (the mesh.exadev.io relay hub Worker) on every merge to main that touches it. Skips cleanly -- green, not red -- until the repo carries the CLOUDFLARE_API_TOKEN secret, so the workflow can land before the secret does.
#
# To enable deploys: add a Cloudflare API token with the "Workers Scripts:Edit" permission (Cloudflare dashboard -> My Profile -> API Tokens -> Create Token; scoping it to this one account is fine) as the repository secret CLOUDFLARE_API_TOKEN, and the account id as CLOUDFLARE_ACCOUNT_ID (71ead1d40a4edda71baa7722524ba3b4).

name: Deploy hub

on:
  push:
    branches: [main]
    paths:
      - "ts/packages/cloudflare-hub/**"
      - "ts/packages/core/src/**"
      - "ts/packages/core/test/**"
      - "ts/packages/web-console/**"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "gradual stages the new version beside the serving one, health-gates it and rolls back on failure; direct is a plain wrangler deploy, needed for a change to a Durable Object class (a migration), which cannot be uploaded as a version"
        type: choice
        options: [gradual, direct]
        default: gradual

# A rollout is never cancelled part way: a cancelled run could leave traffic split between two versions with nothing watching it, so a newer push waits its turn instead.
concurrency:
  group: deploy-hub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ExaDev/wire-mesh' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - name: Install ts/ workspace
        run: pnpm install --frozen-lockfile
        working-directory: ts
      # cloudflare-hub's own _build (wrangler deploy --dry-run) bundles wire-mesh-core and packs web-console's dist/ as its static assets. Both are real turbo task dependencies of cloudflare-hub's _build (wire-mesh-core via the ordinary package-graph dependency, web-console via an explicit cross-package dependsOn in cloudflare-hub's turbo.json, since wrangler.toml's [assets] binding reads its dist/ straight off disk rather than through a package import), so building cloudflare-hub's own task is what pulls both in first: no need to build them as separate steps.
      - name: Build cloudflare-hub (and its wire-mesh-core / web-console dependencies)
        run: pnpm turbo run _build --filter=@exadev/wire-mesh-cloudflare-hub --force
        working-directory: ts
      # A hub whose /health does not yet report a Worker version (it predates the version_metadata binding) cannot be told apart from the version staged beside it, so the one deploy that introduces the binding is a plain deploy. Every later run finds the version and rolls out gradually.
      - name: Choose the deploy mode
        id: mode
        env:
          REQUESTED: ${{ inputs.mode }}
        run: |
          if [ "$REQUESTED" = direct ] || ! curl -fsS https://mesh.exadev.io/health | grep -q '"version"'; then
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          else
            echo "mode=gradual" >> "$GITHUB_OUTPUT"
          fi
      # Uploads the build as a version serving no traffic, health-checks it by version override, shifts a share of traffic to it, health-checks again, promotes it to 100% and checks once more. Any failed check puts the previous version back at 100%, and the previous version serves throughout. rollout/rollout.ts holds the decisions and is unit-tested.
      - name: Deploy gradually
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ steps.mode.outputs.mode }}
          COMMIT: ${{ github.sha }}
        if: env.HAS_API_TOKEN == 'true' && env.MODE == 'gradual'
        working-directory: ts/packages/cloudflare-hub
        run: node --experimental-strip-types rollout/cli.ts --name wire-mesh-hub --url https://mesh.exadev.io --message "deploy-hub $COMMIT"
      - name: Deploy directly
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          MODE: ${{ steps.mode.outputs.mode }}
        if: env.HAS_API_TOKEN == 'true' && env.MODE == 'direct'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ts/packages/cloudflare-hub
      - name: Skipped (secret not configured)
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        if: env.HAS_API_TOKEN != 'true'
        run: echo 'CLOUDFLARE_API_TOKEN secret not set -- deploy skipped. Add it as a repo secret to enable automatic hub deploys.'
      - name: Verify the deployment answers
        run: |
          sleep 5
          curl -fsS https://mesh.exadev.io/health | grep -q '"ok":true'
          curl -fsS https://mesh.exadev.io/ | grep -q 'wire-mesh console'
          curl -fsS https://mesh.exadev.io/manifest.webmanifest | grep -q 'wire-mesh console'
