name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes that PR's in-flight run. A push to main never cancels: the release job publishes to npm and pushes a release commit and tags mid-run, and cancelling it partway would leave a published package with no committed version bump.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cddl-validate:
    name: CDDL Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Regenerate protocol.cddl and confirm it matches the committed file
        working-directory: spec
        run: |
          cp protocol.cddl /tmp/protocol-committed.cddl
          ./generate.sh
          if ! diff -u /tmp/protocol-committed.cddl protocol.cddl; then
            echo "::error::spec/protocol.cddl is out of date. Run spec/generate.sh and commit the result -- never edit protocol.cddl directly."
            exit 1
          fi

      - name: Check for duplicate rule definitions across source files
        working-directory: spec
        run: |
          python3 - <<'PYEOF'
          import glob
          import re
          import sys

          rule_pattern = re.compile(r'^([$a-zA-Z][a-zA-Z0-9_-]*)\s*(=|/=)\s*', re.MULTILINE)
          files = sorted(f for f in glob.glob("*.cddl") if f != "protocol.cddl")

          defined = {}
          for f in files:
              content = open(f).read()
              for m in rule_pattern.finditer(content):
                  defined.setdefault(m.group(1), []).append((f, m.group(2)))

          dupes = {name: locs for name, locs in defined.items() if len([l for l in locs if l[1] == "="]) > 1}
          if dupes:
              print(f"Duplicate rule definitions found across {files} (each rule name must be globally unique across source files):")
              for name, locs in dupes.items():
                  print(f"  {name}: {locs}")
              sys.exit(1)

          print(f"OK -- {len(files)} source files, {len(defined)} distinct rule names, no collisions")
          PYEOF

      - name: Validate against an RFC 8610 CDDL parser
        working-directory: spec
        run: npx --yes cddl@0.21.1 validate protocol.cddl

  conformance-verify:
    name: Conformance Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: conformance/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: conformance/pnpm-lock.yaml

      - name: Install conformance package
        working-directory: conformance
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: conformance
        run: pnpm turbo run _lint

      - name: Typecheck and build codec.ts, verifying its dual ESM/CJS + types with attw
        working-directory: conformance
        run: pnpm turbo run _typecheck

      - name: Confirm generate.ts's output matches the committed vector files
        working-directory: conformance
        run: |
          cp handshake.v1.json /tmp/handshake-committed.json
          cp tokens.v1.json /tmp/tokens-committed.json
          cp frames.v1.json /tmp/frames-committed.json
          pnpm turbo run _generate
          if ! diff -u /tmp/handshake-committed.json handshake.v1.json || ! diff -u /tmp/tokens-committed.json tokens.v1.json || ! diff -u /tmp/frames-committed.json frames.v1.json; then
            echo "::error::conformance/*.v1.json is out of date. Run 'pnpm run generate' in conformance/ and commit the result -- never edit the vector files directly."
            exit 1
          fi

      - name: Verify every vector round-trips through cbor2
        working-directory: conformance
        run: pnpm turbo run _test

  ts-verify:
    name: ts/ Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install wasm-bindgen-cli at the exact version rust/Cargo.lock pins
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' rust/Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen crate resolves to $version -- installing the matching CLI"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build wire-mesh-threshold-wasm's wasm-dist -- required before core's own typecheck/build/test, which import it directly
        working-directory: ts/packages/core
        run: ./scripts/build-threshold-wasm.sh

      - name: Install ts/ workspace
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ts
        run: pnpm turbo run _lint

      - name: Typecheck and build every package, verifying dual ESM/CJS + types with attw
        working-directory: ts
        run: pnpm turbo run _typecheck

      - name: Build every package (cloudflare-hub's wrangler deploy --dry-run validates the Worker bundle without credentials)
        working-directory: ts
        run: pnpm turbo run _build

      - name: Confirm generate.ts's output matches the committed generated schema
        working-directory: ts/packages/core
        run: |
          cp src/generated/protocol.ts /tmp/protocol-committed.ts
          pnpm turbo run _generate
          if ! diff -u /tmp/protocol-committed.ts src/generated/protocol.ts; then
            echo "::error::ts/packages/core/src/generated/protocol.ts is out of date. Run 'pnpm run generate' in ts/packages/core and commit the result -- never edit the generated file directly."
            exit 1
          fi

      - name: Test, including the conformance-check round-tripping conformance/'s golden vectors through the generated schemas
        working-directory: ts
        run: pnpm turbo run _test

  web-console-e2e:
    name: web-console E2E (WebRTC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install ts/ workspace
        working-directory: ts
        run: pnpm install --frozen-lockfile

      - name: Build wire-mesh, the real relay this test signals through
        working-directory: ts
        run: pnpm --filter wire-mesh build

      - name: Install Playwright's Chromium and its OS dependencies
        working-directory: ts/packages/web-console
        run: npx playwright install --with-deps chromium

      - name: Run the WebRTC end-to-end test against a real relay and two real browser contexts
        working-directory: ts/packages/web-console
        run: pnpm run test:e2e

  rust-verify:
    name: rust/ Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        working-directory: rust
        run: cargo build --all-targets

      - name: Clippy (warnings denied)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        working-directory: rust
        run: cargo fmt --check

      - name: Test
        working-directory: rust
        run: cargo test

      - name: Conformance-check every golden vector byte-exactly
        working-directory: rust
        run: cargo run --bin conformance-check

  required-checks:
    name: Required Checks
    needs:
      [cddl-validate, conformance-verify, ts-verify, web-console-e2e, rust-verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [required-checks]
    # Two pushes to main close together must never run this job at the same time: the orchestrator pushes a release commit and tags to main mid-run, and semantic-release's own stale-checkout guard refuses to publish the moment it sees a commit on main this checkout does not have. Queue the second run behind the first rather than cancelling either.
    concurrency:
      group: release-workspace
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to push the release commit and tags, and create GitHub Releases
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # OIDC identity for npm trusted publishing (no NPM_TOKEN)
    steps:
      # main's ruleset requires every change to land through a pull request, and the default GITHUB_TOKEN is not one of its bypass actors. The orchestrator's release commit is a direct push to main, so it needs a token from an actor the ruleset does allow through: the org-wide "exadev" GitHub App, added as an Integration bypass actor on this repository's ruleset.
      - name: Generate a token for the release push
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # ref: main, not the bare event SHA. The orchestrator pushes to the current branch by name, so a detached HEAD stops the run with a WorkspaceStateError rather than pushing HEAD:HEAD. fetch-depth: 0 because each package's release range is analysed from its own last matching tag.
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          # Do NOT set registry-url -- it writes an .npmrc containing an _authToken line, and that line wins over the OIDC token exchange, so the setting that looks like it configures the registry is exactly the one that would stop trusted publishing working.

      - name: Upgrade npm for OIDC trusted publishing (needs npm CLI >=11.5.1)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
        working-directory: ts

      # Nothing in this workspace builds itself from a prepack or prepublishOnly script, so the artefacts @semantic-release/npm publishes have to exist on disk before the orchestrator runs.
      - run: pnpm turbo run _build
        working-directory: ts

      - name: Release every package that changed, in dependency order
        # The orchestrator discovers the workspace from ts/pnpm-workspace.yaml, orders packages topologically, and runs semantic-release per package with commits path-filtered to that package's own directory and tags in `name@version` form.
        run: pnpm release
        working-directory: ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm publish provenance for every package the run publishes, matching each package.json's own publishConfig.provenance.
          NPM_CONFIG_PROVENANCE: "true"
          # Blanked, not omitted -- an inherited NPM_TOKEN/NODE_AUTH_TOKEN from a reusable workflow or composite action would otherwise be used in preference to the OIDC exchange.
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
