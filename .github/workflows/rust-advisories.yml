name: Rust advisories

# Not part of required-checks: an advisory published against a crate already in rust/Cargo.lock must not turn an unrelated pull request red. It runs on a schedule, on manual dispatch and whenever the lockfile or policy changes. A failure outside a pull request opens or updates one issue naming the advisories, so a new advisory does not wait on someone reading a notification.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - rust/Cargo.lock
      - rust/deny.toml
  push:
    branches: [main]
    paths:
      - rust/Cargo.lock
      - rust/deny.toml

jobs:
  cargo-deny-advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    # issues: write is for the failure step below only, which never runs on a pull request (a fork's token cannot write).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny@0.20.2,just@1.59.0

      - name: Check advisories
        run: |
          set -o pipefail
          just rust-advisories 2>&1 | tee "$RUNNER_TEMP/advisories.txt"

      - name: Open or update the advisories issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="cargo-deny reports advisories against rust/Cargo.lock"
          ids=$(grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' "$RUNNER_TEMP/advisories.txt" | sort -u | paste -sd, - | sed 's/,/, /g')
          {
            echo "The scheduled advisories check failed. Advisories: ${ids:-none matched, read the run log}."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            grep -vE '^\s*$' "$RUNNER_TEMP/advisories.txt" | head -c 40000
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
