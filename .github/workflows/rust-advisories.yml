name: Rust advisories

# Not part of required-checks: an advisory published against a crate already in rust/Cargo.lock must not turn an unrelated pull request red. It runs on a schedule, on manual dispatch and whenever the lockfile changes.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - rust/Cargo.lock
      - rust/deny.toml
  push:
    branches: [main]
    paths:
      - rust/Cargo.lock
      - rust/deny.toml

permissions:
  contents: read

jobs:
  cargo-deny-advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories
        working-directory: rust
        run: cargo deny check advisories
